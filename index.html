<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="NH농협은행 PC 웹사이트 UI/UX 프로토타입 시연" />
  <title>NH농협은행 | PC 웹 프로토타입</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', Arial, sans-serif; color: #fff; }
    .stage { position: fixed; inset: 0; inset: 0 0 env(safe-area-inset-bottom) 0; background:#000; }
    .poster { position:absolute;inset:0; background:#000 url('./preview.png') center / contain no-repeat; transition:opacity .3s ease; pointer-events:none; }
    .poster[hidden] { display:none; }
    iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:transparent; }
    .controls { position:fixed; right:18px; top:16px; z-index:5; display:flex;align-items:center; gap:8px; opacity:.06; transition:opacity .18s ease; }
    .controls:hover, .controls:focus-within { opacity:1; }
    .control { appearance:none; border:1px solid #353535; background:rgba(23,23,23,.95); color:#f5f5f5; text-decoration:none; font:500 12px/1.2 inherit; font-family:inherit; padding:10px 12px; border-radius:9px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.24); }
    .control:hover { background:#292929; border-color:#555; }
    .control:focus-visible { outline:2px solid #7dbbff;outline-offset:2px; }
    .fallback { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:min(620px,calc(100vw - 32px)); z-index:2; text-align:center; font-size:12px; line-height:1.5; color:#aaa; opacity:0;pointer-events:none; transition:opacity .2s; }
    .fallback.visible { opacity:1;pointer-events:auto; }
    .fallback a { color:#aacfff; }
    .noscript { position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#000;z-index:10; }
    @media (hover:none) { .controls { opacity:.75; right:10px;top:10px; } .control { padding:8px; font-size:11px; } }
    @media (max-width:600px) { .controls .wide { display:none; } }
  </style>
  <script defer src="./config.js"></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="NH농협은행 PC 웹 시연">
    <div class="poster" id="poster" aria-hidden="true"></div>
    <iframe id="figma" title="NH농협은행 PC 웹 Figma 인터랙티브 프로토타입" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe>
  </main>
  <nav class="controls" aria-label="시연 화면 도구">
    <button type="button" class="control wide" id="reload" title="프로토타입 처음부터 다시 보기">↻ 처음부터</button>
    <button type="button" class="control" id="fullscreen" title="화면 전체 보기">⛶ 전체 화면</button>
    <a id="original" class="control" target="_blank" rel="noopener noreferrer" href="https://www.figma.com/" title="피그마 원본으로 열기">↗ 원본</a>
  </nav>
  <div id="fallback" class="fallback" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">JavaScript를 켜야 프로토타입 시연이 가능합니다.</div></noscript>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const config = window.NH_WEB_CONFIG || {};
      const frame = document.getElementById('figma');
      const poster = document.getElementById('poster');
      const fallback = document.getElementById('fallback');
      const original = document.getElementById('original');
      const source = config.prototypeUrl;
      document.title = config.title || 'NH PC 웹 프로토타입';
      function getEmbed(src) {
        const url = new URL(src);
        if (!['www.figma.com', 'figma.com', 'embed.figma.com'].includes(url.hostname) || !url.pathname.startsWith('/proto/')) throw Error('config.js에 올바른 Figma 프로토타입 링크를 입력해 주세요.');
        url.protocol='https:';
        url.hostname='embed.figma.com';
        url.searchParams.delete('t');
        url.searchParams.set('embed-host','nh-website-prototype-demo');
        url.searchParams.set('hide-ui','1');
        url.searchParams.set('disable-default-keyboard-nav','true');
        url.searchParams.set('footer','false');
        url.searchParams.set('show-proto-sidebar','false');
        url.searchParams.set('viewport-controls','false');
        url.searchParams.set('hotspot-hints','false');
        url.searchParams.set('device-frame',config.showMonitorFrame === false ? 'false' : 'true');
        url.searchParams.set('scaling','contain');
        url.searchParams.set('content-scaling','fixed');
        if (!url.searchParams.has('starting-point-node-id') && url.searchParams.has('node-id')) {
          url.searchParams.set('starting-point-node-id', url.searchParams.get('node-id'));
        }
        return url.href;
      }
      function load() {
        try {
          original.href = source;
          poster.hidden = false;
          frame.src = getEmbed(source);
        } catch (e) {
          frame.removeAttribute('src');
          fallback.innerHTML = '시연 링크 설정 오류: ' + String(e.message).replace(/[<>]/g,'') + ' <a href="./config.js">설정 확인</a>';
          fallback.classList.add('visible');
        }
      }
      frame.addEventListener('load', () => { poster.hidden = true; });
      document.getElementById('reload').addEventListener('click', load);
      document.getElementById('fullscreen').addEventListener('click', async () => {
        if (document.fullscreenElement) { await document.exitFullscreen(); return; }
        try { await document.documentElement.requestFullscreen(); }
        catch { fallback.innerHTML='브라우저에서 전체 화면이 차단됐어요. F11을 눌러 전체 화면을 사용할 수 있습니다.'; fallback.classList.add('visible'); }
      });
      load();
    });
  </script>
</body>
</html>
